name: Daily Reminder

on:
  schedule:
    - cron: "41 15 * * *"   # 15:41 UTC = 9:26 PM Kathmandu
  workflow_dispatch: {}     # lets you manually trigger it to test

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord reminder
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Hi Manish, Time for your nightly dashboard check-in! Go fill it in: https://daily-dashboard-manish77.vercel.app"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
