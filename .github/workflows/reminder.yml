name: Daily Reminder

on:
  schedule:
    - cron: "15 16 * * *"  # 10:00 PM Kathmandu
    - cron: "15 1 * * *"   # 7:00 AM Kathmandu
  workflow_dispatch: {}

jobs:
  nightly-reminder:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 16 * * *'
    steps:
      - name: Send nightly Discord reminder
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "🌙 Hey Manish! Time for your nightly dashboard check-in. Go tick off your tasks and plan tomorrow: https://daily-dashboard-manish77.vercel.app"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

  morning-reminder:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 1 * * *'
    steps:
      - name: Fetch todays tasks and send to Discord
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RESPONSE=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/tasks?scheduled_date=eq.$TODAY&status=eq.pending&is_extra=eq.false&select=text")
          
          TASKS=$(echo $RESPONSE | python3 -c "
          import sys, json
          tasks = json.load(sys.stdin)
          if not tasks:
              print('No tasks planned for today!')
          else:
              print('\n'.join(['• ' + t['text'] for t in tasks]))
          ")
          
          MESSAGE="☀️ Good morning Manish! Here are your tasks for today:\n\n$TASKS\n\nGo get it 💪 → https://daily-dashboard-manish77.vercel.app"
          
          curl -H "Content-Type: application/json" \
          -d "{\"content\": \"$MESSAGE\"}" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}